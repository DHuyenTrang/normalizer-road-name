[package]
name = "road_name_normalizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Deterministic Vietnamese road-name prefix normalization"

readme = "README.md"
repository = "https://github.com/DHuyenTrang/road-name-normalizer"
documentation = "https://docs.rs/road_name_normalizer"
license = "MIT OR Apache-2.0"

keywords = ["vietnamese", "road-names", "normalization", "unicode"]
categories = ["text-processing"]

publish = ["crates-io"]

include = [
    "/src/**",
    "/tests/**",
    "/README.md",
    "/CHANGELOG.md",
    "/docs/**",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
unicode-normalization = "0.1"

[dev-dependencies]
criterion = "0.4"
csv = "1"
proptest = "=1.5.0"
# Keep the property-test process runner readable by Cargo 1.81. Newer
# `tempfile` releases pull an edition-2024-only `getrandom` manifest.
tempfile = "=3.15.0"

[[bench]]
name = "normalize"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
